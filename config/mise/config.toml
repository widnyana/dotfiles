neovim = "0.12.6"
node = "26.13.0"
oh-my-pi = { version = "latest", rename_exe = "omp" }
opencode = { version = "latest", allow_builds = ["@opencode/cli"] }
opentofu = "latest"
pi = "latest"
pre-commit = "4.7.0"
python = "3.15.2"
ripgrep = "15.2.0"
rtk = "1.1.0"
rust = "1.99.1"
rye = "latest"
