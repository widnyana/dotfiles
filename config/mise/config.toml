"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
herdr = "latest"
"github:bettercap/bettercap" = "2.41.7"

[plugins]

[settings]
always_keep_install = false              # deleted on failure by default
jobs = 8
not_found_auto_install = true
paranoid = false                          # see https://mise.jdx.dev/paranoid.html
env_file = '.env'
activate_aggressive = false
asdf_compat = false                       # set to true to ensure .tool-versions will be compatible with asdf, see `MISE_ASDF_COMPAT`
http_timeout = '10'                      # set the timeout for http requests in seconds, see `MISE_HTTP_TIMEOUT`
experimental = true
idiomatic_version_file_enable_tools = []
lockfile = true
auto_update = true
minimum_release_age = "4h"

[settings.npm]
package_manager = "bun"
